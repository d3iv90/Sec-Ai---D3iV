U1L2:[`$a^x$ con $a>0$ è SEMPRE positiva. Con $a>1$ cresce; con $0<a<1$ decresce e nelle disequazioni il verso si inverte. Stessa base → uguagli gli esponenti. Se compaiono $a^{2x}$ e $a^x$ → sostituisci $z=a^x$, risolvi, scarta $z\\le0$ e torna alla $x$ (errori A, B, C). I termini separati da $+$ o $-$ NON si fondono: $3^{2x}-3^x\\ne3^{2x-x}$.`,`Negli esempi della slide il passaggio chiave è scrivere "$z>0$, quindi la soluzione negativa è impossibile". Scrivilo sempre.`],
U1L3:[`$\\log_aA=x\\iff a^x=A$: il logaritmo è l'esponente. PRIMA di tutto la C.E.: argomento $>0$ (errore #32). Somma di log = log del prodotto; differenza = log del quoziente (NON quoziente di log, #23). Equazione: porta a $\\log A=\\log B\\Rightarrow A=B$ e poi controlla la C.E. Disequazione: base $>1$ stesso verso, base $<1$ verso opposto. Esponenziale con basi diverse: logaritmo di entrambi i membri.`,`C.E. scritta all'inizio e intersezione alla fine: è ciò che il professore guarda per primo.`],
U1L4:[`<b>Indice dispari</b>: nessuna C.E., elevi entrambi i membri. <b>Indice pari</b>, equazione: $f\\ge0,\\ g\\ge0,\\ f=g^n$. <b>$\\sqrt f>g$</b>: DUE sistemi uniti, $\\{g\\ge0,\\ f>g^2\\}\\cup\\{f\\ge0,\\ g<0\\}$. <b>$\\sqrt f<g$</b>: UN sistema $\\{f\\ge0,\\ g>0,\\ f<g^2\\}$. Il motivo: una radice è $\\ge0$, quindi se $g<0$ il caso "$>$" è automatico, mentre il caso "$<$" è impossibile.`,`Lo schema a sistemi della slide va scritto esattamente così. Distinguere $>$ da $<$ è la domanda tipica.`],
U1L5:[`Circonferenza di raggio 1: $\\cos$ = ascissa, $\\sin$ = ordinata, $\\tan=\\frac{\\sin}{\\cos}$. $\\sin,\\cos$ hanno periodo $2\\pi$, $\\tan$ ha periodo $\\pi$. Valori notevoli: $30^\\circ$ → $\\sin=\\frac12$; $60^\\circ$ → $\\cos=\\frac12$; $45^\\circ$ → $\\frac{\\sqrt2}2$. Archi associati: base sempre rispetto all'ASSE X (#43), segno dal quadrante. $\\sin^2x+\\cos^2x=1$. Equazioni omogenee: dividi per $\\cos^2x$.`,`Tabella degli angoli a memoria e equazioni riconducibili a una sola funzione sono le richieste tipiche della slide.`],
U2L1:[`$\\mathbb N\\subset\\mathbb Q\\subset\\mathbb R$. Unione, intersezione, complementare; De Morgan: il complementare dell'intersezione è l'unione dei complementari (e viceversa). <b>Estremi</b>: massimo e minimo APPARTENGONO all'insieme; estremo superiore/inferiore no necessariamente. Esempio: $(0,1)$ ha inf $0$ e sup $1$, ma né min né max.`,`Distinguere minimo da estremo inferiore con intervalli aperti e chiusi. Attenzione ai refusi della slide (tab "Slide: refusi").`],
U2L2:[`Una relazione su $A$ è un sottoinsieme di $A\\times A$. Proprietà: riflessiva ($xRx$), simmetrica, antisimmetrica, transitiva. <b>Equivalenza</b> = riflessiva + simmetrica + transitiva (divide l'insieme in classi). <b>Ordine largo</b> = riflessiva + antisimmetrica + transitiva. Esempi: $\\le$ è ordine; "stesso resto nella divisione per 3" è equivalenza.`,`Ti chiedono di verificare le proprietà una per una, con un controesempio per ogni "no", non a parole.`],
U2L3:[`Per dimostrare "$P_n$ vale per ogni $n$": <b>1)</b> base: $P_1$ è vera. <b>2)</b> ipotesi: $P_n$ vera. <b>3)</b> tesi: scrivi esplicita $P_{n+1}$. <b>4)</b> partendo dal lato sinistro di $P_{n+1}$ usi l'ipotesi e arrivi al lato destro. <b>5)</b> conclusione scritta. Verificare "qualche caso" NON è una dimostrazione: nella slide, $127$ è il controesempio.`,`Lo schema in 5 blocchi scritto per intero. Fermarti senza la conclusione è il tuo errore di sempre.`],
U2L4:[`$i^2=-1$, $z=a+ib$. Coniugato $\\bar z=a-ib$; $z\\bar z=a^2+b^2=|z|^2$. Divisione: moltiplica numeratore e denominatore per il coniugato. Potenze di $i$: ciclo di 4 ($i,-1,-i,1$). Forma trigonometrica $z=\\rho(\\cos\\theta+i\\sin\\theta)$, $\\rho=|z|$, $\\theta$ in base al quadrante. È ampiezza e fase di un segnale: lo stesso ragionamento del piano di Gauss.`,`Calcoli espliciti, risultato finale in forma $a+ib$ con numeri veri.`],
U2L5:[`<i>Dalla teoria standard, non dalla slide (non l'ho vista).</i> De Moivre: $z^n=\\rho^n(\\cos n\\theta+i\\sin n\\theta)$. Radici $n$-esime: $\\sqrt[n]\\rho\\left(\\cos\\frac{\\theta+2k\\pi}n+i\\sin\\frac{\\theta+2k\\pi}n\\right)$, $k=0,\\dots,n-1$: sono i vertici di un poligono regolare.`,`Sincrona del 15/10: esercizi con potenze e radici n-esime.`],
U2L6:[`Funzione: a OGNI elemento del dominio corrisponde UNO e un solo elemento del codominio, altrimenti è una semplice relazione. Iniettiva: una freccia al più per ogni $y$. Suriettiva: almeno una. Biunivoca: entrambe. Esempio: $y=x^2$ da $\\mathbb R$ a $\\mathbb R$ non è né iniettiva né suriettiva; ristretta a $[0,+\\infty)$ diventa biunivoca. Monotona: stesso verso su tutto il dominio.`,`La domanda stimolo: "non basta che corrispondano elementi, serve l'unicità". Aspettati esempi con grafico.`],
U3L1:[`Un vettore è una lista ordinata di numeri, come un array. Somma e prodotto per uno scalare componente per componente. <b>Prodotto scalare</b> $\\sum a_ib_i$: è un NUMERO, e vale 0 se i vettori sono perpendicolari. Norma $\\|v\\|=\\sqrt{v_1^2+\\dots+v_n^2}$. Versori $i,j,k$: $v=ai+bj+ck$.`,`Prodotto scalare e perpendicolarità: ti servono di nuovo nella geometria dello spazio.`],
U3L2:[`Una matrice $m\\times n$ ha $m$ righe e $n$ colonne. <b>Prodotto righe per colonne</b>: l'elemento $(i,j)$ è la riga $i$ di $A$ per la colonna $j$ di $B$; le colonne di $A$ devono essere uguali alle righe di $B$ e il risultato è $m\\times p$. Non è commutativo. Trasposta, identità. Inversa $2\\times2$: $\\frac1\\Delta\\begin{pmatrix}d&-b\\\\-c&a\\end{pmatrix}$ con $\\Delta=ad-bc\\ne0$.`,`Prima di calcolare, scrivi le dimensioni del risultato.`],
U3L3:[`$f$ è lineare se somme e scalari "passano dentro": $f(\\alpha x+\\beta y)=\\alpha f(x)+\\beta f(y)$. La matrice di $f$ ha per colonne $f(e_1),f(e_2),\\dots$. Nucleo = vettori che vanno in 0; immagine = combinazioni delle colonne. Iniettiva $\\iff\\ker f=\\{0\\}$; suriettiva $\\iff\\operatorname{Im}f=B$. Vettori linearmente indipendenti: solo la combinazione banale dà 0. Come un circuito lineare: vale la sovrapposizione.`,`Procedura: matrice → riduzione a scalini → rango → nucleo e immagine → iniettiva/suriettiva. La slide chiude con un esercizio in questo stile.`],
U3L4:[`Il sistema $Ax=b$ si scrive come matrice completa $A|b$. Operazioni lecite sulle righe: scambiare, moltiplicare per una costante non nulla, sommare un multiplo di un'altra riga. Con Gauss-Jordan arrivi a una forma a scalini e leggi: <b>soluzione unica</b>, <b>nessuna</b> (riga $0=d\\ne0$), <b>infinite</b> con $n-\\text{rango}$ parametri.`,`Scrivi accanto a ogni riga l'operazione fatta ($R_2\\to R_2-2R_1$) e chiudi con la soluzione numerica esplicita.`],
U3L5:[`<i>Non ho la slide.</i> Dal titolo del calendario completa la lezione precedente con altre tecniche per i sistemi lineari.`,`Sincrona del 22/10.`],
U3L6:[`Retta nello spazio: punto $Q$ + vettore direzione $v$ → $P=Q+kv$, cioè $x=a+kr,\\ y=b+ks,\\ z=c+kt$. Parallele: direzioni proporzionali. Perpendicolari: prodotto scalare 0. Piano per $P$ con vettore normale $(a,b,c)$: $a(x-m)+b(y-n)+c(z-p)=0$. È la retta del piano con una componente in più.`,`Passare da parametriche a simmetriche e viceversa; esercizi di parallela e perpendicolare come nelle slide.`],
U4L1:[`Pari: $f(-x)=f(x)$ (simmetrica rispetto all'asse $y$). Dispari: $f(-x)=-f(x)$ (simmetrica rispetto all'origine). Prima controlla che il dominio sia simmetrico, poi sostituisci $-x$. Né pari né dispari = non simmetrica. Periodica: $f(x+T)=f(x)$; $\\sin,\\cos$ hanno $T=2\\pi$, $\\tan$ ha $T=\\pi$.`,`Verifica algebrica sostituendo $-x$; esempi come $\\frac{x^3}{x^2-1}$ (dispari) e $\\sin x-1$ (non dispari).`],
U4L2:[`Razionale intera: dominio $\\mathbb R$. Fratta: denominatore $\\ne0$. Irrazionale (incognita sotto radice): radicando $\\ge0$ per indice pari. Con una frazione sotto radice o log: UNA tabella segni su $\\frac ND$ (#46). Le radici del numeratore non sono esclusioni (#64, #67).`,`Dominio come unione di intervalli, scritto correttamente.`],
U4L3:[`Dal grafico base, una trasformazione alla volta: $f(x)+k$ sposta in verticale; $f(x+k)$ sposta in orizzontale verso SINISTRA se $k>0$; $kf(x)$ dilata in verticale; $f(kx)$ cambia il periodo in $T/k$; $|f|$ ribalta le parti negative. Per $A\\sin(\\omega x+\\varphi)+c$: ampiezza $A$, periodo $\\frac{2\\pi}\\omega$. Come le onde che conosci.`,`Disegnare il grafico partendo dalla funzione base, indicando immagine e periodo.`],
U4L4:[`Esponenziale: dominio $\\mathbb R$, immagine $(0,+\\infty)$. Logaritmo: dominio $(0,+\\infty)$, immagine $\\mathbb R$; i due grafici sono simmetrici rispetto a $y=x$. Dominio di una composta = SISTEMA di tutte le C.E. Esempio: $e^{\\cos x}$ ha immagine $[e^{-1},e]$.`,`Dominio, immagine e simmetrie per ogni esempio della slide.`],
U4L5:[`Zeri: $f(x)=0$ dentro il dominio. Segno: tabella con zeri del numeratore e del denominatore. Per le composte usa una sostituzione ($z=e^x$) e poi torna alla $x$. Controlla che gli zeri trovati stiano nel dominio. È il tuo metodo fisso: C.E. → intersezioni → segno.`,`Zeri e segno anche di funzioni con esponenziali, valore assoluto e trigonometriche in un intervallo.`]
};

  days+='<span title="'+ds(d)+'" style="display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;margin:2px;border-radius:5px;font-family:JetBrains Mono,monospace;font-size:12px;background:'+(v>=5?'var(--ok)':(v>0?'var(--new)':'var(--line)'))+';color:'+(v>0?'#10151c':'var(--mut)')+'">'+v+'</span>';}
 return '<div class="card"><h3>Palestra di oggi: '+n+' / 5 esercizi</h3><div class="mut">Minimo 5. Più sono meglio, ma 5 non si saltano.</div><div style="margin:8px 0"><button data-pal="-1" style="font-size:20px;width:46px;height:40px">−</button> <button data-pal="1" style="font-size:20px;width:46px;height:40px">+1</button></div><div class="hint">Ultimi 7 giorni (verde = almeno 5):</div><div>'+days+'</div></div>';
}

{id:'G3',t:`Equazioni e disequazioni logaritmiche`,u:['U1L3'],q:[

function renderRegole(){

 s.innerHTML=`<div class="card"><h3>Equazione vs disequazione: la differenza che ti manda in crisi</h3>
 <ul><li><b>Equazione</b>: imposti le C.E., risolvi, poi controlli che le soluzioni le rispettino.</li>
 <li><b>Disequazione</b>: le C.E. entrano NEL SISTEMA con la disequazione e la soluzione finale è l'intersezione. Non c'è "verifica" a posteriori.</li></ul></div>
 <div class="card"><h3>Irrazionali (indice pari)</h3><table>
 <tr><th>Forma</th><th>Schema</th></tr>
 <tr><td>$\\sqrt{f}=g$</td><td>$g\\ge0,\\ f=g^2$ (equivale a $f\\ge0,g\\ge0,f=g^2$)</td></tr>
 <tr><td>$\\sqrt f>g$</td><td>DUE sistemi uniti: $\\{g\\ge0,\\ f>g^2\\}\\cup\\{f\\ge0,\\ g<0\\}$ (#8)</td></tr>
 <tr><td>$\\sqrt f<g$</td><td>UN sistema: $\\{f\\ge0,\\ g>0,\\ f<g^2\\}$</td></tr>
 <tr><td>indice dispari</td><td>nessuna C.E.: si eleva e si tiene il verso</td></tr></table>
 <div class="hint" style="margin-top:6px">Per $\\le$ e $\\ge$ cambiano solo gli estremi: $\\sqrt f\\le g$ → $g\\ge0$.</div></div>
 <div class="card"><h3>Esponenziali e logaritmi</h3><table>
 <tr><th>Caso</th><th>Regola</th></tr>
 <tr><td>$a^x>a^n$</td><td>$a>1$: $x>n$ · $0<a<1$: $x<n$</td></tr>
 <tr><td>ausiliaria $z=a^x$</td><td>vincolo $z>0$; torna a $x$ con $a^x=z_0$ (errori A, B, C)</td></tr>
 <tr><td>$\\log_aA$</td><td>C.E. $A>0$ SEMPRE per prima (#32)</td></tr>
 <tr><td>$\\log_aA>\\log_aB$</td><td>$a>1$: $A>B$ · $0<a<1$: $A<B$ · più C.E. $A>0,B>0$</td></tr></table></div>

$.", "p": ["Dominio: $x\\neq\\pm5$.", "Numeratore: $|x-1|=2\\Rightarrow x=-1,3$.", "Tabella su $-5,-1,3,5$: positiva per $x\\lt-5$, $-1\\lt x\\lt3$, $x\\gt5$."], "r": "zeri $x=-1,3$; $f\\gt0$ in $(-\\infty,-5)\\cup(-1,3)\\cup(5,+\\infty)$"}, {"q": "$2\\sin2x-\\sqrt3$ in $[0,\\pi]$: zeri e segno.", "p": ["$\\sin2x=\\frac{\\sqrt3}2\\Rightarrow2x=\\frac\\pi3,\\frac{2\\pi}3\\Rightarrow x=\\frac\\pi6,\\frac\\pi3$.", "Positiva tra i due zeri."], "r": "zeri $\\frac\\pi6,\\frac\\pi3$; $f\\gt0$ per $\\frac\\pi6\\lt x\\lt\\frac\\pi3$"}], "df": [{"q": "Zeri e segno di $x^2-4$.", "a": "Zeri $\\pm2$; positiva per $x\\lt-2$ o $x\\gt2$."}, {"q": "Zeri e segno di $\\dfrac{x-3}{x+1}$.", "a": "Zero $x=3$; positiva per $x\\lt-1$ o $x\\gt3$."}, {"q": "Dominio e zeri di $\\ln(x^2-3x+3)$.", "a": "$x^2-3x+3\\gt0$ sempre ($\\Delta=-3$): dominio $\\mathbb R$. Zeri: $x^2-3x+3=1\\Rightarrow x=1,2$."}]}];
function renderEsu(){
 var s=document.getElementById('s-esu');
 var h='<div class="card"><h3>Come usare questa scheda</h3><ul><li>Per ogni lezione: <b>attenzione</b> (i tuoi errori ricorrenti), <b>svolti</b> con i passaggi e <b>da fare</b>, dal più semplice al più difficile.</li><li>Fai 6–7 esercizi al giorno: prima apri la teoria, poi gli svolti, poi i «da fare» con carta e penna.</li><li>Il piano ufficiale resta nel tab Piano. Teoria completa e procedure: <a href="archivio_zappulla.html" style="color:var(--part)">Teoria</a>. Esercizi di Unità 1: <a href="palestra_u1.html" style="color:var(--part)">Esercizi</a>.</li></ul></div>';
 h+='<div class="card"><h3>Dove spendere le ore (proposta)</h3><table><tr><th>Unità</th><th>Peso</th><th>Perché</th></tr><tr><td>1</td><td>basso</td><td>Il programma la dà per scontata. Bastano i test d\'ingresso e la palestra: 5 esercizi al giorno sui punti deboli.</td></tr><tr><td>2</td><td>medio</td><td>Insiemi, relazioni, induzione sono nuovi ma brevi; i complessi richiedono calcolo.</td></tr><tr><td>3</td><td>alto</td><td>Vettori, matrici, sistemi, spazio: è tutto nuovo e di calcolo. Qui vanno più ore.</td></tr><tr><td>4</td><td>medio-basso</td><td>Gran parte è già fatta con Zappulla (domini, segno, trasformazioni da rivedere).</td></tr></table><div class="hint" style="margin-top:6px">È una proposta dal piano a fasi del tab Piano. Se cambia la data dell\'appello, la rivediamo.</div></div>';
 h+='<div class="card"><h3>Unità 1</h3><div class="mut">Retta, parabola, esponenziali, logaritmi, irrazionali, trigonometria. Qui ti alleni con la pagina <a href="palestra_u1.html" style="color:var(--part)">Esercizi</a> (livelli da 1 a 10) e rivedi le procedure nella <a href="archivio_zappulla.html" style="color:var(--part)">Teoria</a>.</div></div>';
 var cu=0;
 ESU.forEach(function(u){
  var n=parseInt(u.id.charAt(1),10);
  if(n!==cu){cu=n;h+='<h2 style="font-size:14px;color:var(--mut);margin:16px 2px 8px">Unità '+cu+'</h2>';}
  h+='<div class="card"><h3>'+u.id+' · '+u.t+'</h3><div class="warn mut" style="margin:6px 0">'+u.att+'</div>';
  h+='<details><summary>Esercizi svolti ('+u.sv.length+')</summary>';
  u.sv.forEach(function(x,i){
   h+='<div style="margin:10px 0;padding-top:8px;border-top:1px solid var(--line)"><b>'+(i+1)+'.</b> '+x.q+'<ol style="margin:6px 0">'+x.p.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ol><div><b>Risultato:</b> '+x.r+'</div></div>';
  });
  h+='</details>';
  h+='<details><summary>Da fare, dal più semplice ('+u.df.length+')</summary>';
  u.df.forEach(function(x,i){
   var k='x_'+u.id+'_'+i;
   h+='<div style="margin:10px 0;padding-top:8px;border-top:1px solid var(--line)"><label class="chk"><input type="checkbox" data-k="'+k+'"'+(state[k]?' checked':'')+'><span style="font-family:Crimson Pro,serif;font-size:17px"><b>'+(i+1)+'.</b> '+x.q+'</span></label><details><summary>Soluzione (dopo averci provato)</summary><div>'+x.a+'</div></details></div>';
  });
  h+='</details></div>';
 });
 s.innerHTML=h;
}

/* ---------- navigazione ---------- */
var tabs=[['piano','Piano'],['gate','Test d\'ingresso'],['cal','Calendario'],['sync','Sincronizza'],['lezioni','Lezioni'],['esu','Esercizi per unità'],['errori','Errori'],['regole','C.E. e regole'],['file','I tuoi file'],['trappole','Slide: refusi']];
var nav=document.getElementById('nav');
tabs.forEach(function(t,i){
 var b=document.createElement('button');b.textContent=t[1];b.setAttribute('data-t',t[0]);
 if(i===0)b.className='on';
 b.addEventListener('click',function(){show(t[0])});nav.appendChild(b);
});
function show(id){
 Array.prototype.forEach.call(document.querySelectorAll('section'),function(s){s.classList.remove('on')});
 document.getElementById('s-'+id).classList.add('on');state._tab=id;save();
 Array.prototype.forEach.call(nav.children,function(b){b.classList.toggle('on',b.getAttribute('data-t')===id)});
 window.scrollTo(0,0);
}
document.getElementById('s-piano').classList.add('on');

/* ---------- progresso globale ---------- */
function progress(){
 var tot=0,done=0;
 L.forEach(function(l){if(l.st==='miss')return;['video','esercizi','activity'].forEach(function(n){tot++;if(state[key(l.id,n)])done++;})});
 var pct=tot?Math.round(done/tot*100):0;
 document.getElementById('gbar').style.width=pct+'%';
 document.getElementById('gtxt').textContent='Lezioni: '+done+' / '+tot+' passi completati ('+pct+'%)';
}

/* delega eventi sulle checkbox */
document.addEventListener('click',function(e){
 var go=e.target.getAttribute&&e.target.getAttribute('data-go');
 if(go){show('lezioni');var c=document.getElementById('card-'+go);if(c)c.scrollIntoView();return;}
 var act=e.target.getAttribute&&e.target.getAttribute('data-act');
 if(act==='gen'){document.getElementById('sy-out').value=JSON.stringify(state);return;}
 if(act==='copy'){var o=document.getElementById('sy-out');if(!o.value)o.value=JSON.stringify(state);o.select();try{document.execCommand('copy');}catch(er){}return;}
 if(act==='imp'){
  var m=document.getElementById('sy-msg');
  try{var n=JSON.parse(document.getElementById('sy-in').value);if(typeof n!=='object'||n===null)throw 0;
   Object.keys(n).forEach(function(k){state[k]=n[k]});save();m.textContent='Importato. Ricarico...';setTimeout(function(){location.reload()},500);}
  catch(er){m.textContent='Testo non valido. Controlla di aver copiato tutto.';}
  return;}
 var gg=e.target.getAttribute&&e.target.getAttribute('data-g');
 if(gg){var pr=gg.split('|');state['g_'+pr[0]+'_'+pr[1]]=pr[2];save();updateGate(pr[0]);return;}
 var d=e.target.getAttribute&&e.target.getAttribute('data-pal');
 if(!d)return;
 var k='pal_'+ds(new Date());
 state[k]=Math.max(0,(state[k]||0)+parseInt(d,10));save();renderPiano();math();
});
document.addEventListener('change',function(e){
 var k=e.target.getAttribute&&e.target.getAttribute('data-k');
 if(!k)return;
 state[k]=e.target.checked;
 var lid=k.split('|')[0];if(/^U\d/.test(lid)){state._last=lid;var bm=document.getElementById('bm');if(bm)bm.innerHTML=bmHTML();}
 save();progress();
});

renderPiano();renderGates();renderCal();renderSync();renderLezioni();renderEsu();renderErrori();renderFile();renderRegole();renderTrappole();progress();GATES.forEach(function(g){updateGate(g.id)});
(function(){var hh=(location.hash||'').slice(1);if(hh&&document.getElementById('s-'+hh))show(hh);})();

 if(window.renderMathInElement){
  renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false,strict:false});
 } else { setTimeout(math,200); }
}
window.addEventListener('load',math);
})();
