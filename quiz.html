<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--tx:#e6e3da;--mut:#9aa0ac;--ok:#5fbf8a;--ko:#e0705f;--ac:#d4b25c;--bl:#7aa7e0}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:'Crimson Pro',Georgia,serif;font-size:19px;line-height:1.5;padding:14px;max-width:780px}
h1,h2,.mono{font-family:'JetBrains Mono',monospace}
h1{font-size:19px;margin:4px 0 2px}h2{font-size:14px;color:var(--ac);margin:14px 0 6px}
.sub{color:var(--mut);font-size:16px;margin-bottom:8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
a.pill,button.pill{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;margin:11px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut)}
.q{font-size:21px;margin:6px 0 10px;overflow-x:auto}
button.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#1d212a;color:var(--tx);font-family:inherit;font-size:18px;cursor:pointer}
button.opt.right{border-color:var(--ok);background:#14221b}button.opt.wrong{border-color:var(--ko);background:#271716}
button.opt[disabled]{cursor:default}
input.num{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:16px}
.go{display:inline-block;margin-top:10px;background:var(--ac);color:#0f1115;padding:10px 14px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;border:0;cursor:pointer;text-decoration:none}
.go.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.exp{border-left:3px solid var(--ac);padding-left:10px;margin-top:10px;color:var(--tx)}
.ok{color:var(--ok)}.ko{color:var(--ko)}
.prog{height:6px;background:var(--line);border-radius:3px;margin:8px 0}.prog>div{height:6px;background:var(--ac);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-top:1px solid var(--line);padding:6px 4px;text-align:left}
th{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mut);font-weight:500;border-top:0}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:'JetBrains Mono',monospace;font-size:12px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div class="bar" style="margin-top:0"><a class="pill" href="index.html">← Menu</a><a class="pill" href="tutor.html">Tutor</a><a class="pill" href="quiz.html">Tutti i quiz</a></div>
<h1>Quiz</h1>
<div class="sub">Mettiti alla prova senza guardare gli appunti. L'esito va al Tutor da solo, e puoi copiarlo per la chat.</div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var BUILTIN=[{"id": "rel1", "t": "Proprietà delle relazioni (prima dell'e-tivity 2.2.2)", "q": [{"t": "tf", "q": "Se una relazione non è simmetrica, allora è antisimmetrica.", "c": false, "tag": "U2L2:simmetria", "lv": 3, "e": "Falso: può non essere né simmetrica né antisimmetrica. Esempio su $A=\\{1,2,3\\}$: $R=\\{(1,2),(2,1),(1,3)\\}$ non è simmetrica ($1R3$ ma non $3R1$) e non è antisimmetrica ($1R2$ e $2R1$ con $1\\ne2$)."}, {"t": "mc", "q": "Su $A=\\{1,2,3\\}$ sia $R=\\{(1,1),(2,2)\\}$. Quale affermazione è vera?", "o": ["$R$ è riflessiva", "$R$ è antiriflessiva", "$R$ non è né riflessiva né antiriflessiva", "$R$ è riflessiva ma non simmetrica"], "c": 2, "tag": "U2L2:riflessività", "lv": 3, "e": "Manca $(3,3)$, quindi non è riflessiva; c'è $(1,1)$, quindi non è antiriflessiva."}, {"t": "mc", "q": "La relazione vuota $R=\\emptyset$ su $A=\\{1,2,3\\}$ è…", "o": ["solo antiriflessiva", "antiriflessiva, simmetrica, antisimmetrica e transitiva", "riflessiva", "né simmetrica né antisimmetrica"], "c": 1, "tag": "U2L2:vacuità", "lv": 5, "e": "Le proprietà sono del tipo «per ogni… se…»: con $R$ vuota la premessa non si verifica mai, quindi la condizione è vera a vuoto."}, {"t": "mc", "q": "Su $\\mathbb Z$ sia $a\\,R\\,b$ se $a\\le b$. Quale affermazione è vera?", "o": ["è simmetrica", "è riflessiva, antisimmetrica e transitiva", "è antiriflessiva", "è di equivalenza"], "c": 1, "tag": "U2L2:ordine", "lv": 3, "e": "$a\\le a$; da $a\\le b$ e $b\\le a$ segue $a=b$; da $a\\le b$ e $b\\le c$ segue $a\\le c$. Non è simmetrica: $1\\le2$ ma non $2\\le1$."}, {"t": "tf", "q": "Su $\\mathbb Z$ la relazione $a\\lt b$ è antisimmetrica.", "c": true, "tag": "U2L2:vacuità", "lv": 6, "e": "La premessa «$a\\lt b$ e $b\\lt a$» non si verifica mai: la condizione è vera a vuoto. È anche antiriflessiva e transitiva, ma non riflessiva."}, {"t": "tf", "q": "Su $\\mathbb Z$ la relazione «$a-b$ è pari» è una relazione di equivalenza.", "c": true, "tag": "U2L2:equivalenza", "lv": 4, "e": "Riflessiva: $a-a=0$ è pari. Simmetrica: se $a-b$ è pari lo è anche $b-a$. Transitiva: $(a-b)+(b-c)=a-c$ è somma di pari."}, {"t": "mc", "q": "Su $\\mathbb N^*=\\{1,2,3,\\dots\\}$ sia $a\\,R\\,b$ se $a$ divide $b$. Quale affermazione è vera?", "o": ["è simmetrica", "è riflessiva, antisimmetrica e transitiva", "è antiriflessiva", "è antisimmetrica ma non transitiva"], "c": 1, "tag": "U2L2:ordine", "lv": 5, "e": "$a\\mid a$; se $a\\mid b$ e $b\\mid a$ allora $a=b$ (numeri positivi); se $a\\mid b$ e $b\\mid c$ allora $a\\mid c$. Non è simmetrica: $2\\mid4$ ma $4\\nmid2$."}, {"t": "mc", "q": "Su $A=\\{1,2,3\\}$ sia $R=\\{(1,2),(2,3)\\}$. Quale coppia, aggiunta da sola, rende $R$ transitiva?", "o": ["$(1,3)$", "$(3,1)$", "$(2,1)$", "$(3,3)$"], "c": 0, "tag": "U2L2:transitività", "lv": 4, "e": "Da $1R2$ e $2R3$ serve $1R3$. Con $(1,3)$ aggiunta non nascono altri obblighi."}, {"t": "num", "q": "Quante coppie ha, al minimo, una relazione di equivalenza su un insieme di 5 elementi?", "a": ["5"], "tag": "U2L2:equivalenza", "lv": 4, "e": "Serve la riflessività: le 5 coppie $(a,a)$. La relazione identità è già simmetrica e transitiva."}, {"t": "self", "q": "Fai un controesempio all'affermazione: «una relazione simmetrica e transitiva è sempre riflessiva».", "r": "$A=\\{1\\}$ e $R=\\emptyset$: è simmetrica e transitiva (a vuoto), ma $1R1$ non vale, quindi non è riflessiva.", "tag": "U2L2:equivalenza", "lv": 7, "e": "Il «ragionamento» tipico è: $aRb\\Rightarrow bRa$, poi $aRb$ e $bRa\\Rightarrow aRa$. Ma serve che esista un $b$ con $aRb$: se un elemento non è in relazione con nessuno, il ragionamento non parte."}]}];
var EMBED=null; /* quiz autonomo: riempi con {"id":"...","t":"...","q":[...]} */
function jl(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{};}catch(e){return {};}}
function wl(k,o){try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}}
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
function render(el){if(window.renderMathInElement){renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],strict:false,throwOnError:false});}}
function ds(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
var TODAY=(window.__TODAY__)||ds(new Date());
var C=jl('fao_custom_v1'),QR=jl('fao_quiz_v1');
function allQ(){var m={},o=[];BUILTIN.forEach(function(q){m[q.id]=q;});(C.quiz||[]).forEach(function(q){m[q.id]=q;});if(EMBED&&EMBED.id)m[EMBED.id]=EMBED;Object.keys(m).forEach(function(k){o.push(m[k]);});return o;}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,'').replace(',','.');}
var app=document.getElementById('app'),cur=null,idx=0,res=[],locked=false;
function listView(){
  app.innerHTML='';var qs=allQ();
  if(!qs.length){app.appendChild(mk('div','card','Nessun quiz ancora. Chiedi al Tutor di prepararne uno (prompt «Quiz» nella pagina Tutor) e importalo con la riga FAO2.'));return;}
  qs.forEach(function(q){
    var c=mk('div','card');c.appendChild(mk('div','meta',q.q.length+' domande'));c.appendChild(mk('div','q',q.t));
    var h=(QR[q.id]&&QR[q.id].h)||[];
    if(h.length){var l=h[h.length-1];c.appendChild(mk('div','meta','Ultimo tentativo '+l.d.slice(8)+'/'+l.d.slice(5,7)+': '+l.s+'/'+l.nq+' · tentativi '+h.length));}
    var b=mk('button','go','Inizia');b.addEventListener('click',function(){start(q);});c.appendChild(b);app.appendChild(c);
  });
  render(app);
}
function start(q){cur=q;idx=0;res=[];draw();window.scrollTo(0,0);}
function expl(box,q,ok){
  var e=mk('div','exp','');e.appendChild(mk('b',ok?'ok':'ko',ok?'Giusto. ':'Sbagliato. '));
  if(q.t==='self'&&q.r)e.appendChild(document.createTextNode('Risposta modello: '+q.r+' '));
  if(q.e)e.appendChild(document.createTextNode(q.e));box.appendChild(e);
}
function record(q,ok,given){res.push({tag:q.tag||'generale',ok:ok,q:q.q,given:given,right:q.t==='mc'?q.o[q.c]:(q.t==='tf'?(q.c?'Vero':'Falso'):(q.t==='num'?(q.a||[]).join(' / '):(q.r||'')))});}
function draw(){
  app.innerHTML='';
  if(idx>=cur.q.length){return finish();}
  var q=cur.q[idx],c=mk('div','card');
  c.appendChild(mk('div','meta',cur.t+' · domanda '+(idx+1)+' di '+cur.q.length+(q.tag?' · '+q.tag:'')+(q.lv?' · livello '+q.lv:'')));
  var pg=mk('div','prog'),pi=mk('div','');pi.style.width=Math.round(idx/cur.q.length*100)+'%';pg.appendChild(pi);c.appendChild(pg);
  c.appendChild(mk('div','q',q.q));var area=mk('div','');c.appendChild(area);var fb=mk('div','');c.appendChild(fb);
  var nxt=mk('button','go','Avanti');nxt.style.display='none';nxt.addEventListener('click',function(){idx++;draw();window.scrollTo(0,0);});c.appendChild(nxt);
  function done(ok,given){record(q,ok,given);expl(fb,q,ok);nxt.style.display='inline-block';nxt.textContent=idx+1>=cur.q.length?'Vedi il risultato':'Avanti';render(c);}
  if(q.t==='mc'){
    var bs=[];q.o.forEach(function(o,i){var b=mk('button','opt',o);bs.push(b);b.addEventListener('click',function(){bs.forEach(function(x,j){x.disabled=true;if(j===q.c)x.className='opt right';});if(i!==q.c)b.className='opt wrong';done(i===q.c,o);});area.appendChild(b);});
  }else if(q.t==='tf'){
    var bt=[];[['Vero',true],['Falso',false]].forEach(function(p){var b=mk('button','opt',p[0]);bt.push([b,p[1]]);b.addEventListener('click',function(){bt.forEach(function(x){x[0].disabled=true;if(x[1]===q.c)x[0].className='opt right';});if(p[1]!==q.c)b.className='opt wrong';done(p[1]===q.c,p[0]);});area.appendChild(b);});
  }else if(q.t==='num'){
    var inp=document.createElement('input');inp.className='num';inp.type='text';inp.placeholder='Scrivi la risposta';area.appendChild(inp);
    var vb=mk('button','go','Verifica');vb.addEventListener('click',function(){if(!inp.value.trim())return;var g=norm(inp.value),ok=(q.a||[]).some(function(a){var x=norm(a);return x===g||(!isNaN(parseFloat(x))&&!isNaN(parseFloat(g))&&Math.abs(parseFloat(x)-parseFloat(g))<1e-9);});inp.disabled=true;vb.style.display='none';done(ok,inp.value);});area.appendChild(vb);
  }else{
    var sb=mk('button','go','Mostra la risposta');area.appendChild(sb);
    sb.addEventListener('click',function(){sb.style.display='none';var e=mk('div','exp','');e.appendChild(document.createTextNode('Risposta modello: '+(q.r||'')+' '));if(q.e)e.appendChild(document.createTextNode(q.e));area.appendChild(e);
      var y=mk('button','go','Lo sapevo'),n=mk('button','go sec','Non lo sapevo');y.style.marginRight='8px';
      function pick(ok){record(q,ok,ok?'sapevo':'non sapevo');y.style.display='none';n.style.display='none';nxt.style.display='inline-block';nxt.textContent=idx+1>=cur.q.length?'Vedi il risultato':'Avanti';}
      y.addEventListener('click',function(){pick(true);});n.addEventListener('click',function(){pick(false);});area.appendChild(y);area.appendChild(n);render(area);});
  }
  app.appendChild(c);render(app);
}
function finish(){
  app.innerHTML='';var n=res.length,s=res.filter(function(r){return r.ok;}).length,tags={};
  res.forEach(function(r){var t=tags[r.tag]||(tags[r.tag]=[0,0]);t[1]++;if(r.ok)t[0]++;});
  var h=QR[cur.id]||(QR[cur.id]={h:[]});if(!h.h)h.h=[];h.h.push({d:TODAY,s:s,nq:n,tags:tags});QR[cur.id]=h;wl('fao_quiz_v1',QR);
  var c=mk('div','card');c.appendChild(mk('div','meta',cur.t));c.appendChild(mk('div','q',s+' su '+n+' ('+Math.round(100*s/n)+'%)'));
  var v=s/n>=0.8?'Solido: puoi andare avanti.':(s/n>=0.6?'Ci sei quasi: rivedi le domande sbagliate e rifai tra un paio di giorni.':'Ancora fragile: torna sulla teoria prima di avanzare.');
  c.appendChild(mk('div','',v));
  var t=mk('table','');var hd=mk('tr','');['Concetto','Giuste'].forEach(function(x){hd.appendChild(mk('th','',x));});t.appendChild(hd);
  Object.keys(tags).forEach(function(k){var r=mk('tr','');r.appendChild(mk('td','',k));r.appendChild(mk('td',tags[k][0]===tags[k][1]?'ok':'ko',tags[k][0]+'/'+tags[k][1]));t.appendChild(r);});c.appendChild(t);
  var wr=res.filter(function(r){return !r.ok;});
  if(wr.length){c.appendChild(mk('h2','','Da rivedere'));wr.forEach(function(r){var d=mk('div','');d.style.margin='8px 0';d.appendChild(mk('div','meta',r.tag));d.appendChild(mk('div','',r.q));d.appendChild(mk('div','ko','Tua risposta: '+r.given));d.appendChild(mk('div','ok','Corretta: '+r.right));c.appendChild(d);});}
  var txt='ESITO QUIZ «'+cur.t+'» ('+TODAY+'): '+s+'/'+n+'.\n';
  if(wr.length)txt+='Sbagliate:\n'+wr.map(function(r){return '- ['+r.tag+'] '+r.q+' (mia: '+r.given+'; corretta: '+r.right+')';}).join('\n')+'\n';
  txt+='FAO2:'+JSON.stringify({d:TODAY,quizres:{id:cur.id,d:TODAY,s:s,nq:n,tags:tags}});
  var ta=document.createElement('textarea');ta.readOnly=true;ta.value=txt;c.appendChild(mk('h2','','Esito da incollare nella chat'));c.appendChild(ta);
  var cp=mk('button','go','Copia esito');var msg=mk('div','meta','');
  cp.addEventListener('click',function(){function fb(){ta.readOnly=false;ta.select();try{document.execCommand('copy');msg.textContent='Copiato.';}catch(e){msg.textContent='Tieni premuto sul testo e scegli Copia.';}ta.readOnly=true;}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){msg.textContent='Copiato.';},fb);else fb();});
  c.appendChild(cp);c.appendChild(msg);
  var again=mk('button','go sec','Rifai');again.style.marginLeft='8px';again.addEventListener('click',function(){start(cur);});c.appendChild(again);
  var bk=mk('a','go sec','Tutor');bk.href='tutor.html';bk.style.marginLeft='8px';c.appendChild(bk);
  app.appendChild(c);render(app);
}
(function(){
  var m=(location.hash||'').match(/id=([^&]+)/),want=m?decodeURIComponent(m[1]):null,qs=allQ();
  if(EMBED&&EMBED.id){start(EMBED);return;}
  if(want){for(var i=0;i<qs.length;i++)if(qs[i].id===want){start(qs[i]);return;}}
  listView();
})();
</script>
</body>
</html>
