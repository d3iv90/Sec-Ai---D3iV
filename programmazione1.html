    if(vc(L)>0){tot+=vc(L);if(vD(L))done+=vc(L);}
    if(sc(L)>0){tot+=sc(L);if(sD(L))done+=sc(L);}
    if(ec(L)>0){tot+=ec(L);if(aD(L))done+=ec(L);}
  });(u.C||[]).forEach(function(c){tot+=c.min;if(T.f[c.id])done+=c.min;});});
  return {tot:tot,done:done};
}
var TAB='piano';
var TABS=[['piano','Piano'],['lezioni','Lezioni'],['compiti','Compiti'],['esercizi','Esercizi'],['errori','Errori'],['info','Info']];
function drawTabs(){var b=document.getElementById('tabs');b.innerHTML='';TABS.forEach(function(x){var p=mk('button','pill'+(TAB===x[0]?' on':''),x[1]);p.addEventListener('click',function(){TAB=x[0];location.hash='t='+x[0];draw();});b.appendChild(p);});}
function lessonRows(u){
  var w=mk('div','tw'),t=mk('table','');var hd=mk('tr','');['Lezione','Video','Slide','E-tivity'].forEach(function(x){hd.appendChild(mk('th','',x));});t.appendChild(hd);
  u.L.forEach(function(L){var le=LES[L],r=mk('tr','');var c0=mk('td','',L+' · '+le.t);if(le.sinc)c0.appendChild(mk('span','tag bl',fmt(le.sd)+' 17:00'));r.appendChild(c0);
    var tv=mk('td','');if(le.v>0){tv.appendChild(chk(vD(L),function(v){setHub(L+'|video',v);load();draw();}));tv.appendChild(document.createTextNode(' '+le.v+'′'));}else tv.textContent='—';r.appendChild(tv);
    var ts=mk('td','');if(sc(L)>0){ts.appendChild(chk(sD(L),function(v){T.sl[L]=v;wl(TK,T);load();draw();}));ts.appendChild(document.createTextNode(' '+sc(L)+'′'));}else ts.textContent='—';r.appendChild(ts);
    var ta=mk('td','');if(le.e>0){ta.appendChild(chk(aD(L),function(v){setHub(L+'|activity',v);load();draw();}));ta.appendChild(document.createTextNode(' '+le.e+'′'));}else ta.textContent='—';r.appendChild(ta);t.appendChild(r);});
  w.appendChild(t);return w;
}
function viewPiano(v){
  var tt=totals(),pc=tt.tot?Math.round(100*tt.done/tt.tot):0;
  var c=mk('div','card');c.appendChild(mk('div','meta',DOC+(MAN?' · '+MAN:'')));
  c.appendChild(mk('div','',pc+'% fatto · '+hh(tt.done)+' su '+hh(tt.tot)+' di lavoro autonomo (video, slide, e-tivity, compiti; sincrone escluse)'));
  var pg=mk('div','prog'),pi=mk('div','');pi.style.width=pc+'%';pg.appendChild(pi);c.appendChild(pg);
  c.appendChild(mk('div','mut','Obiettivo che stai puntando: '+endLabel()+' (si cambia nel Tutor). Il piano giorno per giorno lo fa il Tutor: qui vedi lo stato del modulo.'));
  var a=mk('a','go','Apri il Tutor');a.href='tutor.html';c.appendChild(a);v.appendChild(c);
  var c2=mk('div','card');c2.appendChild(mk('h2','','Unità'));
  var w=mk('div','tw'),t=mk('table','');var hd=mk('tr','');['Unità','Pronta entro','Video','Slide','E-tivity','Compito'].forEach(function(x){hd.appendChild(mk('th','',x));});t.appendChild(hd);
  UNITS.forEach(function(u){
    var nv=0,dv=0,ns=0,ds_=0,na=0,da=0;u.L.forEach(function(L){if(vc(L)>0){nv++;if(vD(L))dv++;}if(sc(L)>0){ns++;if(sD(L))ds_++;}if(ec(L)>0){na++;if(aD(L))da++;}});
    var r=mk('tr','');r.appendChild(mk('td','',u.nm.split(' · ').slice(1).join(' · ')));r.appendChild(mk('td','',unitBy(u)?fmt(unitBy(u)):'—'));
    r.appendChild(mk('td','',dv+'/'+nv));r.appendChild(mk('td','',ds_+'/'+ns));r.appendChild(mk('td','',da+'/'+na));
    var cs=(u.C||[]),dn=cs.filter(function(c){return T.f[c.id];}).length;var td=mk('td','');td.appendChild(mk('span','tag '+(dn===cs.length&&cs.length?'ok':'ac'),dn+'/'+cs.length+' consegnati'));r.appendChild(td);t.appendChild(r);});
  w.appendChild(t);c2.appendChild(w);v.appendChild(c2);
  var c3=mk('div','card');c3.appendChild(mk('h2','','Sincrone'));
  SYNC.forEach(function(s){var p=s.d<TODAY;var l=mk('div','',(p?'✓ ':'')+fmt(s.d)+' 17:00 · '+s.s+(T.maint!==false&&s.d>='2026-11-02'&&s.d<='2026-11-08'?' · cade nella settimana di lavoro (saltata)':''));l.style.opacity=p?0.55:1;c3.appendChild(l);});
  v.appendChild(c3);
  var c4=mk('div','card');c4.appendChild(mk('h2','','Prossimi passi'));
  var steps=[];
  UNITS.forEach(function(u){u.L.forEach(function(L){
    if(vc(L)>0&&!vD(L))steps.push('Video '+L+' · '+LES[L].t+' ('+vc(L)+'′)');
    if(sc(L)>0&&!sD(L))steps.push('Slide e letture '+L+' · '+LES[L].t+' ('+sc(L)+'′)');
    if(ec(L)>0&&!aD(L))steps.push('E-tivity '+L+' · '+LES[L].t+' ('+ec(L)+'′)');
  });});
  if(!steps.length)c4.appendChild(mk('div','mut','Tutto spuntato.'));
  steps.slice(0,8).forEach(function(s){c4.appendChild(mk('div','',s));});
  if(steps.length>8)c4.appendChild(mk('div','mut','…e altri '+(steps.length-8)+'. L\'ordine giusto lo decide il Tutor in base alle scadenze.'));
  v.appendChild(c4);
}
function viewLezioni(v){
  v.appendChild(mk('div','mut','Spunti qui ciò che fai su Ariel: video, slide, e-tivity. Le spunte sono le stesse del Tutor. Le e-tivity con scenario hanno quiz di ripasso → scenario → peer review → forum: le scadenze sono su Ariel.'));
  UNITS.forEach(function(u){var c=mk('div','card');c.appendChild(mk('h2','',u.nm));c.appendChild(lessonRows(u));v.appendChild(c);});
}
function viewCompiti(v){
  v.appendChild(mk('div','mut','Ogni compito è «Vincolante: Sì» su Ariel. Il docente verifica originalità e uso di strumenti di IA: io correggo il tuo lavoro, non risolvo. Le scadenze di consegna non compaiono nei PDF: controllale su Ariel.'));
  UNITS.forEach(function(u){(u.C||[]).forEach(function(cc){
    var c=mk('div','card');c.appendChild(mk('div','meta',u.nm));c.appendChild(mk('div','',cc.t+' · '+cc.min+'′'));
    c.appendChild(mk('div','mut',{completa:'Traccia con gli esercizi visibile nel PDF di Ariel.',scenario:'Visto solo lo scenario: i quesiti sono in un file da scaricare su Ariel.',no:'Traccia non ancora vista.'}[cc.known]));
    c.appendChild(mk('div','mut',cc.n));
    var l=mk('label','chk');l.appendChild(chk(!!T.f[cc.id],function(x){T.f[cc.id]=x;wl(TK,T);load();draw();}));l.appendChild(mk('span','','Consegnato'));c.appendChild(l);v.appendChild(c);});});
}
function viewEsercizi(v){
  var list=C.ex.filter(function(e){return e.a.indexOf(MOD+'U')===0;});
  var c=mk('div','card');
  if(!list.length){c.appendChild(mk('div','','Nessun esercizio ancora per questo modulo.'));
    c.appendChild(mk('div','mut','Gli esercizi nascono dalle slide: nel Tutor → «Chat e prompt» → «Teoria / PDF» scegli la lezione, apri una chat nuova con il PDF allegato e importa la riga FAO2 che ti restituisco. Compariranno qui e nella palestra.'));}
  else{c.appendChild(mk('div','mut',list.length+' esercizi scritti per questo modulo. ✓/✗ si segnano nella palestra.'));
    var ids=list.map(function(e){return e.id;}).join(',');var a=mk('a','go','Apri nella palestra');a.href='palestra_u1.html#ids='+ids;c.appendChild(a);
    list.forEach(function(e){var h=(P.h&&P.h[e.id])||[],l=h.length?h[h.length-1]:null;var w=mk('div','');w.style.cssText='border-top:1px solid var(--line);padding:8px 0';
      w.appendChild(mk('div','meta',e.a+' · livello '+e.l+(l?' · ultimo: '+(l.r==='ok'?'✓':'✗')+' ('+h.length+'×)':' · mai fatto')));w.appendChild(mk('div','q',e.q));c.appendChild(w);});}
  v.appendChild(c);render(c);
}
function viewErrori(v){
  var errs=C.errs.filter(function(e){return (e.a||'').indexOf(MOD)===0;}),codes={};errs.forEach(function(e){codes[e.c]=1;});
  var oss=C.oss.filter(function(o){return codes[o.c];});
  var c=mk('div','card');
  if(!errs.length){c.appendChild(mk('div','','Nessun errore catalogato per questo modulo.'));c.appendChild(mk('div','mut','Gli errori entrano così: mandi le foto del quaderno in una chat «Esercizi» (o «Compito»), a fine chat scrivi CHIUDI e importi la riga FAO2 nel Tutor. Gli errori nuovi vengono numerati con l\'area del modulo (per esempio '+MOD+') e compaiono qui.'));}
  errs.forEach(function(e){var w=mk('div','');w.style.cssText='border-top:1px solid var(--line);padding:8px 0';w.appendChild(mk('div','meta',e.c+' · '+e.a+' · '+(e.t||'')));w.appendChild(mk('div','',e.d));if(e.w)w.appendChild(mk('div','mut','Sbagliato: '+e.w));if(e.k)w.appendChild(mk('div','mut','Corretto: '+e.k));if(e.g)w.appendChild(mk('div','mut','Regola: '+e.g));c.appendChild(w);});
  if(oss.length){c.appendChild(mk('h2','','Osservazioni'));oss.forEach(function(o){c.appendChild(mk('div','mut',fmt(o.d)+' · '+o.c+' ('+o.tp+') '+(o.ex||'')+': '+o.n));});}
  v.appendChild(c);render(c);
}
function viewInfo(v){var c=mk('div','card');var ul=mk('ul','');INFO.forEach(function(x){ul.appendChild(mk('li','',x));});c.appendChild(ul);v.appendChild(c);}
function draw(){
  document.getElementById('sub').textContent=DOC+' · stato letto dal browser, condiviso con il Tutor';
  drawTabs();var v=document.getElementById('view');v.innerHTML='';
  ({piano:viewPiano,lezioni:viewLezioni,compiti:viewCompiti,esercizi:viewEsercizi,errori:viewErrori,info:viewInfo})[TAB](v);
}
load();
var mm=(location.hash||'').match(/t=(\w+)/);if(mm&&TABS.some(function(x){return x[0]===mm[1];}))TAB=mm[1];
draw();
window.addEventListener('pageshow',function(){load();draw();});
</script>
</body>
